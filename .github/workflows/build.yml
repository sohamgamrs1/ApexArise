name: Build APK from ZIP
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract ZIP
        run: |
          ZIP=$(ls *.zip | head -n 1)
          echo "Found $ZIP"
          rm -rf /tmp/backup /tmp/extracted
          mkdir -p /tmp/backup
          unzip -o "$ZIP" -d /tmp/extracted
          PUB=$(find /tmp/extracted -name "pubspec.yaml" | head -n 1)
          DIR=$(dirname "$PUB")
          echo "Project in ZIP: $DIR"
          cp -r $DIR/* /tmp/backup/ 2>/dev/null || true
          rm -rf /tmp/extracted
          ls -la /tmp/backup/lib/ | head -n 20

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: 'stable'

      - name: Create fresh Android v2 embedding
        run: |
          rm -rf android
          flutter create . --project-name apexarise --org com.apexarise.system --platforms android --no-pub
          echo "Fresh android created"

      - name: Restore code + FULL pubspec with ALL deps
        run: |
          rm -rf lib assets test
          cp -r /tmp/backup/lib . 2>/dev/null || true
          cp -r /tmp/backup/assets . 2>/dev/null || true
          # FULL pubspec - sob package add kora
          cat > pubspec.yaml <<'EOF'
          name: apexarise
          description: ApexArise - Gamified Focus OS
          publish_to: 'none'
          version: 1.0.0+1
          environment:
            sdk: '>=3.0.0 <4.0.0'
            flutter: ">=3.22.0"
          dependencies:
            flutter:
              sdk: flutter
            cupertino_icons: ^1.0.6
            flutter_riverpod: ^2.5.1
            shared_preferences: ^2.2.2
            fl_chart: ^0.68.0
            flutter_overlay_window: ^1.0.2
            usage_stats: ^1.3.1
            device_apps: ^2.2.0
            permission_handler: ^11.3.0
            flutter_local_notifications: ^17.0.0
            firebase_core: ^2.24.2
            hive: ^2.2.3
            hive_flutter: ^1.1.0
            google_fonts: ^6.1.0
            intl: ^0.19.0
            path_provider: ^2.1.1
          dev_dependencies:
            flutter_test:
              sdk: flutter
            flutter_lints: ^3.0.0
            hive_generator: ^2.0.1
            build_runner: ^2.4.7
          flutter:
            uses-material-design: true
            assets:
              - assets/
          EOF
          echo "FULL pubspec written:"
          cat pubspec.yaml

      - name: Fix Kotlin version to 1.9.22
        run: |
          sed -i "s/ext.kotlin_version = '.*'/ext.kotlin_version = '1.9.22'/" android/build.gradle || true
          sed -i "s/kotlin_version = '.*'/kotlin_version = '1.9.22'/" android/build.gradle || true
          # If still not found, inject
          if ! grep -q "kotlin_version" android/build.gradle; then
            echo "ext.kotlin_version = '1.9.22'" >> android/build.gradle
          fi
          cat android/build.gradle | grep -n kotlin || true
          # Fix gradle wrapper to 7.6 for kotlin 1.9 compat
          cat android/gradle/wrapper/gradle-wrapper.properties | head -n 10

      - run: flutter pub get

      - name: Generate Hive adapters
        run: |
          flutter pub run build_runner build --delete-conflicting-outputs || dart run build_runner build --delete-conflicting-outputs
          ls -la lib/models/ || true

      - run: flutter build apk --release --no-tree-shake-icons

      - uses: actions/upload-artifact@v4
        with:
          name: ApexArise-APK
          path: build/app/outputs/flutter-apk/app-release.apk
