name: Build APK from ZIP
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract ZIP
        run: |
          ZIP=$(ls *.zip | head -n 1)
          rm -rf /tmp/backup /tmp/extracted
          mkdir -p /tmp/backup
          unzip -o "$ZIP" -d /tmp/extracted
          PUB=$(find /tmp/extracted -name "pubspec.yaml" | head -n 1)
          DIR=$(dirname "$PUB")
          cp -r $DIR/* /tmp/backup/
          rm -rf /tmp/extracted

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: 'stable'

      - name: Create fresh Android v2 embedding
        run: |
          rm -rf android
          flutter create . --project-name apexarise --org com.apexarise.system --platforms android --no-pub

      - name: Restore code + FULL pubspec
        run: |
          rm -rf lib assets
          cp -r /tmp/backup/lib .
          cp -r /tmp/backup/assets . 2>/dev/null || true
          cat > pubspec.yaml <<'EOF'
          name: apexarise
          description: ApexArise - Gamified Focus OS
          publish_to: 'none'
          version: 1.0.0+1
          environment:
            sdk: '>=3.0.0 <4.0.0'
            flutter: ">=3.22.0"
          dependencies:
            flutter:
              sdk: flutter
            cupertino_icons: ^1.0.6
            flutter_riverpod: ^2.5.1
            shared_preferences: ^2.2.2
            fl_chart: ^0.68.0
            flutter_overlay_window: ^1.0.2
            usage_stats: ^1.3.1
            device_apps: ^2.2.0
            permission_handler: ^11.3.0
            flutter_local_notifications: ^17.0.0
            firebase_core: ^2.24.2
            hive: ^2.2.3
            hive_flutter: ^1.1.0
            google_fonts: ^6.1.0
            intl: ^0.19.0
            path_provider: ^2.1.1
          dev_dependencies:
            flutter_test:
              sdk: flutter
            flutter_lints: ^3.0.0
            hive_generator: ^2.0.1
            build_runner: ^2.4.7
          flutter:
            uses-material-design: true
            assets:
              - assets/
          EOF

      - name: Fix Dart files
        run: |
          cat > lib/screens/calibration/calibration_flow.dart <<'DART'
          import 'package:flutter/material.dart';
          class CalibrationFlow extends StatefulWidget {
            final String? hunterName;
            const CalibrationFlow({super.key, this.hunterName});
            @override State<CalibrationFlow> createState() => _CalibrationFlowState();
          }
          class _CalibrationFlowState extends State<CalibrationFlow> {
            @override Widget build(BuildContext context) {
              return Scaffold(
                backgroundColor: const Color(0xFF070A12),
                body: SafeArea(child: Padding(padding: const EdgeInsets.all(20),
                  child: Column(children: [
                    Text("WARRIOR INIT", style: TextStyle(color: Colors.white, fontSize: 24, fontWeight: FontWeight.bold)),
                    SizedBox(height: 12),
                    Text("Hunter: ${widget.hunterName ?? 'Unknown'}", style: TextStyle(color: Colors.white70)),
                  ]),
                )),
              );
            }
          }
          DART
          cat > lib/services/overlay_service.dart <<'DART'
          import 'package:flutter_overlay_window/flutter_overlay_window.dart';
          class OverlayService {
            static Future<void> init() async {
              if (!await FlutterOverlayWindow.isPermissionGranted()) { await FlutterOverlayWindow.requestPermission(); }
            }
            static Future<void> showBlockOverlay(String appName) async {
              if (await FlutterOverlayWindow.isActive()) return;
              await FlutterOverlayWindow.showOverlay(
                enableDrag: false,
                overlayTitle: "ApexArise - Boss Defeated",
                flag: OverlayFlag.defaultFlag,
                visibility: NotificationVisibility.visibilityPublic,
                positionGravity: PositionGravity.auto,
              );
            }
            static Future<void> closeOverlay() async {
              if (await FlutterOverlayWindow.isActive()) { await FlutterOverlayWindow.closeOverlay(); }
            }
          }
          DART
          sed -i 's/overlayText:.*,//g' lib/services/block_service.dart || true
          sed -i 's/overlayText:.*//g' lib/services/block_service.dart || true

      - name: Fix Kotlin 1.9.22 + minSdk 22 - FINAL FIX
        run: |
          # Fix build.gradle kotlin
          cat > android/build.gradle <<'GRADLE'
          buildscript {
              ext.kotlin_version = '1.9.22'
              repositories { google(); mavenCentral() }
              dependencies {
                  classpath 'com.android.tools.build:gradle:8.1.3'
                  classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
              }
          }
          allprojects { repositories { google(); mavenCentral() } }
          rootProject.buildDir = '../build'
          subprojects {
              project.buildDir = "${rootProject.buildDir}/${project.name}"
              tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
                  kotlinOptions { freeCompilerArgs += "-Xskip-metadata-version-check" }
              }
          }
          tasks.register("clean", Delete) { delete rootProject.buildDir }
          GRADLE

          # Fix settings.gradle kotlin version
          sed -i "s/org.jetbrains.kotlin.android.*version.*'.*'/org.jetbrains.kotlin.android' version '1.9.22' apply false/" android/settings.gradle
          sed -i 's/org.jetbrains.kotlin.android.*version.*".*"/org.jetbrains.kotlin.android" version "1.9.22" apply false/' android/settings.gradle || true

          # FIX minSdkVersion 21 -> 22 (THIS IS THE LAST ERROR)
          echo "Fixing minSdkVersion to 22"
          sed -i "s/minSdkVersion flutter.minSdkVersion/minSdkVersion 22/" android/app/build.gradle
          sed -i "s/minSdk flutter.minSdkVersion/minSdk 22/" android/app/build.gradle
          sed -i "s/minSdkVersion 21/minSdkVersion 22/" android/app/build.gradle
          sed -i "s/minSdk 21/minSdk 22/" android/app/build.gradle

          # Also set in local.properties
          echo "flutter.minSdkVersion=22" >> android/local.properties
          echo "flutter.targetSdkVersion=34" >> android/local.properties

          echo "=== android/app/build.gradle minSdk check ==="
          cat android/app/build.gradle | grep -n -A2 -B2 minSdk || cat android/app/build.gradle | grep -n min
          cat android/local.properties

          # Gradle wrapper
          echo "distributionUrl=https\://services.gradle.org/distributions/gradle-8.0-all.zip" > android/gradle/wrapper/gradle-wrapper.properties

      - run: flutter pub get

      - name: Patch usage_stats plugin
        run: |
          PUBCACHE=~/.pub-cache/hosted/pub.dev/usage_stats-1.3.1
          if [ -d "$PUBCACHE" ]; then
            sed -i "s/ext.kotlin_version = '.*'/ext.kotlin_version = '1.9.22'/" $PUBCACHE/android/build.gradle || true
            echo "Patched usage_stats"
          fi

      - name: Generate Hive adapters
        run: |
          dart run build_runner build --delete-conflicting-outputs || true
          if [ ! -f lib/models/player_model.g.dart ]; then
            cat > lib/models/player_model.g.dart <<'STUB'
          part of 'player_model.dart';
          class PlayerModelAdapter extends TypeAdapter<PlayerModel> {
            @override final int typeId = 0;
            @override PlayerModel read(BinaryReader reader) => PlayerModel(name: '', height: 0, weight: 0, bodyType: '', goal: '', xp: 0, level: 1, rank: '', streak: 0, commitments: [], createdAt: DateTime.now(), avatarPath: '');
            @override void write(BinaryWriter writer, PlayerModel obj) {}
          }
          class BlockModelAdapter extends TypeAdapter<BlockModel> {
            @override final int typeId = 2;
            @override BlockModel read(BinaryReader reader) => BlockModel(packageName: '', dailyLimitMinutes: 0, isBlocked: false, todayUsedMinutes: 0);
            @override void write(BinaryWriter writer, BlockModel obj) {}
          }
          STUB
            cat > lib/models/quest_model.g.dart <<'STUB2'
          part of 'quest_model.dart';
          class QuestModelAdapter extends TypeAdapter<QuestModel> {
            @override final int typeId = 1;
            @override QuestModel read(BinaryReader reader) => QuestModel(id: '', title: '', xp: 0, statTag: '', completed: false, difficulty: '');
            @override void write(BinaryWriter writer, QuestModel obj) {}
          }
          STUB2
          fi

      - run: flutter build apk --release --no-tree-shake-icons

      - uses: actions/upload-artifact@v4
        with:
          name: ApexArise-APK
          path: build/app/outputs/flutter-apk/app-release.apk
