name: Build APK from ZIP
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract ZIP
        run: |
          ZIP=$(ls *.zip | head -n 1)
          echo "Found $ZIP"
          rm -rf /tmp/backup
          mkdir -p /tmp/backup
          unzip -o "$ZIP" -d /tmp/extracted
          PUB=$(find /tmp/extracted -name "pubspec.yaml" | head -n 1)
          DIR=$(dirname "$PUB")
          echo "Project in ZIP: $DIR"
          cp -r $DIR/* /tmp/backup/ 2>/dev/null || true
          cp -r $DIR/.* /tmp/backup/ 2>/dev/null || true
          rm -rf /tmp/extracted
          ls -la /tmp/backup/

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: 'stable'

      - name: Create fresh Android v2 embedding
        run: |
          rm -rf android
          flutter create . --project-name apexarise --org com.apexarise.system --platforms android --no-pub
          ls -la android/app/src/main/kotlin/ || ls -la android/app/src/main/java/ || true

      - name: Restore code + Auto-Fix pubspec
        run: |
          # Restore lib and assets
          rm -rf lib assets
          cp -r /tmp/backup/lib . 2>/dev/null || true
          cp -r /tmp/backup/assets . 2>/dev/null || true
          # Restore other Dart files if any
          # Overwrite pubspec with fixed version
          cat > pubspec.yaml <<'EOF'
          name: apexarise
          description: ApexArise - Gamified Focus OS
          publish_to: 'none'
          version: 1.0.0+1
          environment:
            sdk: '>=3.0.0 <4.0.0'
            flutter: ">=3.22.0"
          dependencies:
            flutter:
              sdk: flutter
            cupertino_icons: ^1.0.6
            flutter_riverpod: ^2.5.1
            shared_preferences: ^2.2.2
            fl_chart: ^0.68.0
            flutter_overlay_window: ^1.0.2
            usage_stats: ^1.0.3
            device_apps: ^2.2.0
            permission_handler: ^11.3.0
            flutter_local_notifications: ^17.0.0+1
          dev_dependencies:
            flutter_test:
              sdk: flutter
            flutter_lints: ^3.0.0
          flutter:
            uses-material-design: true
            assets:
              - assets/
          EOF
          echo "Fixed pubspec:"
          cat pubspec.yaml
          echo "Lib files:"
          ls -la lib/

      - run: flutter pub get
      - run: flutter build apk --release --no-tree-shake-icons

      - uses: actions/upload-artifact@v4
        with:
          name: ApexArise-APK
          path: build/app/outputs/flutter-apk/app-release.apk
